<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f6b78" />
    <title>TIK College — колледж порталы</title>
    <style>
      :root {
        --navy: #172967;
        --navy2: #243b86;
        --blue: #347cf3;
        --sky: #edf3ff;
        --ink: #1c2944;
        --muted: #74809a;
        --line: #e5e9f1;
        --paper: #f5f7fb;
        --white: #fff;
        --green: #17865d;
        --amber: #a76813;
        --red: #bc4242;
        --shadow: 0 12px 32px #23366d12;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
      .topline {
        height: 6px;
        background: var(--navy);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        color: var(--navy);
        font-family: Georgia, serif;
        font-size: 29px;
      }
      .brand small {
        display: block;
        font:
          11px/1.2 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .mark {
        width: 44px;
        height: 44px;
        border: 2px solid var(--navy);
        border-radius: 50% 50% 43% 43%;
        display: grid;
        place-items: center;
        font: 700 13px Arial;
        position: relative;
      }
      .mark:after {
        content: "";
        position: absolute;
        bottom: -6px;
        width: 30px;
        border-bottom: 3px double var(--navy);
        transform: skewY(-20deg);
      }
      /* login */
      .login-page {
        min-height: 100vh;
        background: white;
      }
      .login-brand {
        height: 110px;
        border-bottom: 6px solid var(--navy);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
      }
      .login-brand .mark {
        width: 52px;
        height: 52px;
      }
      .login-brand .brand-name {
        font:
          40px Georgia,
          serif;
        color: var(--navy);
      }
      .login-wrap {
        width: min(100% - 30px, 460px);
        margin: 66px auto 35px;
      }
      .login-card {
        border: 2px solid var(--navy);
        border-radius: 7px;
        padding: 7px;
        box-shadow: 0 2px 8px #12245212;
      }
      .login-inner {
        background: #f2f2f2;
        border: 1px solid #e2e2e2;
        border-radius: 5px;
        padding: 27px 22px 24px;
      }
      .login-inner h1 {
        text-align: center;
        font:
          italic 21px Georgia,
          serif;
        color: #929292;
        margin: 0 0 27px;
      }
      .label {
        display: block;
        font-weight: 700;
        color: #285279;
        margin: 0 0 7px;
      }
      .field {
        width: 100%;
        height: 46px;
        border: 1px solid #aaa;
        border-radius: 7px;
        background: white;
        padding: 0 12px;
        margin-bottom: 15px;
        outline: none;
      }
      .field:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px #347cf322;
      }
      .login-button,
      .primary {
        background: var(--blue);
        color: white;
        border: 0;
        border-radius: 23px;
        padding: 9px 21px;
        font-weight: 700;
      }
      .login-alert {
        min-height: 22px;
        color: var(--red);
        font-size: 14px;
        margin: -5px 0 9px;
      }
      .demo-box {
        border: 1px solid #dce4f5;
        background: #f8faff;
        border-radius: 10px;
        padding: 13px;
        margin-top: 16px;
      }
      .demo-box strong {
        font-size: 13px;
      }
      .demo-accounts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        margin-top: 10px;
      }
      .account-pick {
        border: 1px solid #dbe2f1;
        background: white;
        border-radius: 8px;
        padding: 8px 5px;
        text-align: center;
        color: var(--navy);
        font-size: 12px;
      }
      .account-pick:hover {
        border-color: var(--blue);
        background: #f3f7ff;
      }
      .demo-note {
        color: var(--muted);
        font-size: 11px;
        margin: 10px 0 0;
        line-height: 1.4;
      }
      /* app shell */
      #app {
        min-height: 100vh;
      }
      .app-header {
        height: 76px;
        background: white;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .head-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .year-pill {
        color: var(--navy);
        background: #f0f4ff;
        border-radius: 20px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 700;
      }
      .icon-btn {
        border: 1px solid var(--line);
        background: white;
        color: var(--navy);
        padding: 8px 12px;
        border-radius: 9px;
      }
      .app-layout {
        display: grid;
        grid-template-columns: 238px minmax(0, 1fr);
        min-height: calc(100vh - 76px);
      }
      .sidebar {
        background: white;
        border-right: 1px solid var(--line);
        padding: 20px 14px;
      }
      .role-tag {
        color: #52617f;
        background: #f3f5f9;
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 700;
        margin: 0 7px 15px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        border: 0;
        text-align: left;
        background: transparent;
        color: #54617b;
        border-radius: 9px;
        padding: 11px 12px;
      }
      .nav button:hover,
      .nav button.active {
        background: #edf3ff;
        color: var(--navy);
        font-weight: 700;
      }
      .nav .ico {
        display: inline-block;
        width: 25px;
      }
      .side-user {
        border-top: 1px solid var(--line);
        margin: 23px 7px 0;
        padding-top: 17px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .side-user .user-text {
        font-size: 12px;
      }
      .side-user small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        flex: none;
        background: linear-gradient(145deg, #f3d8ca, #c1d4fb);
        color: var(--navy);
        font-weight: 800;
        border: 2px solid white;
        box-shadow: 0 0 0 1px #dbe2f0;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar.large {
        width: 86px;
        height: 86px;
        font-size: 24px;
      }
      .main {
        padding: 28px clamp(16px, 3vw, 38px) 50px;
        max-width: 1320px;
        width: 100%;
        margin: 0 auto;
      }
      .eyebrow {
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .page-title {
        font-size: 27px;
        margin: 4px 0 3px;
        color: #172554;
      }
      .subline {
        color: var(--muted);
        margin: 0 0 22px;
      }
      .profile-card,
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }
      .profile-card {
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 19px;
      }
      .profile-info {
        flex: 1;
      }
      .profile-info h2 {
        font-size: 21px;
        margin: 0 0 3px;
      }
      .profile-info p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .profile-meta {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        margin-top: 11px;
      }
      .chip {
        background: #f2f5fb;
        color: #435473;
        border-radius: 20px;
        padding: 5px 10px;
        font-size: 11px;
      }
      .photo-button {
        border: 1px solid #dbe2f1;
        background: #fff;
        border-radius: 8px;
        color: var(--navy);
        padding: 8px 10px;
        font-size: 12px;
      }
      .card {
        padding: 18px;
        margin: 0 0 17px;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .card h3 {
        margin: 0;
        font-size: 16px;
      }
      .card-head p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .soft-button {
        border: 1px solid #dce3f0;
        background: white;
        border-radius: 8px;
        color: var(--navy);
        padding: 8px 10px;
        font-size: 12px;
      }
      .soft-button:hover {
        background: #f5f8ff;
      }
      .week-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .week-label {
        font-weight: 700;
        font-size: 13px;
        color: #43516d;
        margin: 0 4px;
      }
      .week-grid {
        display: grid;
        grid-template-columns: 78px repeat(5, minmax(115px, 1fr));
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        min-width: 700px;
      }
      .week-scroll {
        overflow: auto;
      }
      .week-head {
        background: #f4f7fc;
        text-align: center;
        padding: 10px 5px;
        font-size: 11px;
        color: #596780;
        font-weight: 800;
        border-bottom: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .time-head {
        background: #f4f7fc;
        border-bottom: 1px solid var(--line);
      }
      .time-cell {
        background: #fafbfe;
        padding: 12px 6px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        text-align: center;
        color: #66748c;
        font-size: 10px;
      }
      .lesson-cell {
        min-height: 73px;
        padding: 6px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: white;
      }
      .lesson-card {
        background: #edf3ff;
        border-left: 3px solid var(--blue);
        border-radius: 7px;
        padding: 6px 7px;
        margin: 2px 0;
        color: #243c74;
        font-size: 10px;
        line-height: 1.35;
      }
      .lesson-card strong {
        display: block;
        font-size: 11px;
        color: #182b5c;
      }
      .lesson-card span {
        display: block;
        color: #60708f;
      }
      .lesson-card.empty {
        background: transparent;
        border: 0;
      }
      .schedule-note {
        font-size: 11px;
        color: var(--muted);
        margin: 10px 0 0;
      }
      .year-select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        color: var(--navy);
        background: white;
        font-weight: 600;
      }
      .admin-table-wrap {
        overflow: auto;
      }
      .admin-table {
        border-collapse: collapse;
        width: 100%;
        min-width: 850px;
      }
      .admin-table th {
        text-align: left;
        font-size: 11px;
        color: #74809a;
        background: #f7f8fb;
        padding: 9px;
        border-bottom: 1px solid var(--line);
      }
      .admin-table td {
        padding: 7px;
        border-bottom: 1px solid #edf0f5;
      }
      .admin-table input,
      .admin-table select {
        width: 100%;
        min-width: 70px;
        border: 1px solid #dfe4ee;
        border-radius: 6px;
        padding: 7px;
        background: white;
        font-size: 12px;
      }
      .admin-table .del {
        border: 0;
        background: #fff0f0;
        color: #b43e3e;
        border-radius: 6px;
        padding: 7px 9px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .primary.small {
        font-size: 12px;
        padding: 8px 12px;
        border-radius: 8px;
      }
      .success-note {
        color: var(--green);
        font-size: 12px;
        min-height: 20px;
        margin: 6px 0 0;
      }
      .people {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .person {
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 13px;
        display: flex;
        align-items: center;
        gap: 11px;
        background: white;
      }
      .person strong {
        display: block;
        font-size: 13px;
      }
      .person small {
        color: var(--muted);
      }
      .empty-state {
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }
      .footer-note {
        text-align: center;
        color: #8993a5;
        font-size: 10px;
        padding: 20px;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #172967;
        color: white;
        border-radius: 9px;
        padding: 10px 16px;
        z-index: 9;
        font-size: 12px;
        box-shadow: 0 8px 30px #0003;
      }
      @media (max-width: 800px) {
        .app-layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: auto;
          z-index: 7;
          border-right: 0;
          border-top: 1px solid var(--line);
          padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        }
        .role-tag,
        .side-user {
          display: none;
        }
        .nav {
          display: flex;
          justify-content: space-around;
          gap: 2px;
        }
        .nav button {
          font-size: 10px;
          text-align: center;
          padding: 7px 4px;
          min-width: 60px;
        }
        .nav .ico {
          display: block;
          width: auto;
          font-size: 16px;
          margin-bottom: 2px;
        }
        .main {
          padding: 19px 13px 105px;
        }
        .app-header {
          height: 64px;
          padding: 0 14px;
        }
        .app-header .brand {
          font-size: 23px;
        }
        .app-header .brand small {
          font-size: 8px;
        }
        .app-header .mark {
          width: 36px;
          height: 36px;
          font-size: 11px;
        }
        .year-pill {
          display: none;
        }
        .profile-card {
          padding: 14px;
          gap: 12px;
          align-items: flex-start;
          flex-wrap: wrap;
        }
        .profile-info h2 {
          font-size: 18px;
        }
        .photo-button {
          margin-left: auto;
        }
        .page-title {
          font-size: 23px;
        }
        .week-grid {
          min-width: 650px;
        }
        .card {
          padding: 14px;
        }
        .head-right {
          gap: 7px;
        }
        .week-tools {
          width: 100%;
        }
      }
      @media (max-width: 440px) {
        .login-brand {
          height: 88px;
        }
        .login-brand .brand-name {
          font-size: 29px;
        }
        .login-wrap {
          margin: 45px auto;
        }
        .login-inner {
          padding: 23px 17px;
        }
        .demo-accounts {
          grid-template-columns: 1fr;
        }
        .account-pick {
          text-align: left;
          padding: 9px;
        }
        .avatar.large {
          width: 70px;
          height: 70px;
        }
        .profile-card .avatar.large {
          margin-top: 4px;
        }
      }

      /* Teacher workload and shift timetable */
      .notice {
        background: #eef4ff;
        border: 1px solid #dce6fa;
        border-left: 4px solid #347cf3;
        border-radius: 10px;
        padding: 13px 15px;
        margin: 0 0 19px;
        color: #486080;
        font-size: 12px;
        line-height: 1.6;
      }
      .schedule-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 0 0 18px;
      }
      .segmented {
        display: flex;
        background: #e9eef9;
        padding: 4px;
        border-radius: 10px;
        gap: 3px;
      }
      .segmented button {
        border: 0;
        padding: 8px 13px;
        border-radius: 7px;
        background: transparent;
        color: #5c6c88;
        font-weight: 700;
        font-size: 12px;
      }
      .segmented .selected {
        background: white;
        color: #172967;
        box-shadow: 0 2px 6px #182f6720;
      }
      .shift-section + .shift-section {
        margin-top: 25px;
      }
      .shift-caption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
        color: #253f76;
      }
      .shift-caption span {
        font-size: 12px;
        color: #76849b;
      }
      .draft-badge {
        display: inline-block;
        background: #fff0d1;
        color: #a56619;
        border-radius: 4px;
        font-size: 9px;
        padding: 1px 5px;
        margin-top: 4px;
      }
      .lesson-card {
        font-size: 10px;
      }
      .lesson-card strong {
        font-size: 11px;
      }
      .card-head {
        flex-wrap: wrap;
      }
      .calendar-form {
        display: flex;
        align-items: end;
        gap: 15px;
        flex-wrap: wrap;
      }
      .calendar-form label {
        display: grid;
        gap: 6px;
        color: #5d6d85;
        font-size: 12px;
      }
      .calendar-form input {
        border: 1px solid #dbe2ed;
        padding: 8px;
        border-radius: 7px;
        background: white;
        color: #263859;
      }
      .nowrap {
        white-space: nowrap;
      }
      .error-notice {
        padding: 12px;
        border-radius: 8px;
        background: #fff0ee;
        color: #b54436;
        margin-top: 12px;
        font-size: 12px;
      }
      .soft-button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .demo-box .year-select {
        width: 100%;
        margin-top: 7px;
      }
      .demo-box label {
        display: block;
      }
      .schedule-controls .year-select {
        max-width: 220px;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 3px solid #bcd4ff;
        outline-offset: 2px;
      }
      @media (max-width: 800px) {
        .schedule-controls {
          gap: 7px;
        }
        .segmented {
          width: 100%;
          justify-content: center;
        }
        .segmented button {
          flex: 1;
        }
        .schedule-controls .year-select {
          font-size: 11px;
        }
        .notice {
          font-size: 11px;
          padding: 11px;
        }
        .shift-caption {
          align-items: flex-start;
          flex-direction: column;
          gap: 2px;
        }
        .photo-button {
          margin-left: 0;
        }
        .calendar-form label {
          width: 100%;
        }
      }

      /* Calendar week selector */
      .date-navigation {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .date-toggle {
        display: flex;
        align-items: center;
        gap: 11px;
        border: 1px solid #d2dff5;
        border-radius: 9px;
        background: white;
        color: #263e73;
        padding: 9px 13px;
        font-weight: 700;
        font-size: 12px;
      }
      .date-toggle[aria-expanded="true"] {
        border-color: #347cf3;
        background: #f1f6ff;
      }
      .date-toggle span {
        color: #8a9bb7;
        margin-left: 3px;
      }
      .month-calendar {
        width: min(100%, 360px);
        padding: 16px;
        border: 1px solid #dce4f1;
        border-radius: 14px;
        background: white;
        box-shadow: 0 9px 30px #273c7520;
        margin: -4px 0 19px;
      }
      .month-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 13px;
      }
      .month-header h3 {
        margin: 0;
        font-size: 15px;
        color: #1f376b;
      }
      .month-header .soft-button {
        font-size: 20px;
        padding: 1px 11px;
      }
      .month-days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 3px;
      }
      .month-day-name {
        text-align: center;
        font-size: 10px;
        color: #8895aa;
        padding: 3px 0 6px;
      }
      .month-day {
        border: 0;
        background: transparent;
        height: 36px;
        border-radius: 7px;
        color: #30496c;
        font-size: 12px;
        position: relative;
      }
      .month-day:hover {
        background: #eef3ff;
      }
      .month-day.other-month {
        color: #afb9c9;
      }
      .month-day.selected-week {
        background: #eaf1ff;
